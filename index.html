<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería</title>
  <meta name="theme-color" content="#d35400">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #d35400;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      max-width: 800px;
      margin: 20px auto;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }
    .card h3 {
      margin: 10px 0 5px 0;
      font-size: 1.1rem;
      color: #2c3e50;
    }
    .precio {
      font-weight: bold;
      color: #27ae60;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <h1>🍞 Panadería</h1>
  <div id="contenedor-productos" class="grid">
    <p>Cargando productos...</p>
  </div>

  <script>
    // Cargar productos desde productos.json
    async function cargarProductos() {
      try {
        const respuesta = await fetch('./productos.json?v=' + new Date().getTime());
        const productos = await respuesta.json();
        const contenedor = document.getElementById('contenedor-productos');
        
        contenedor.innerHTML = '';

        if (!productos || productos.length === 0) {
          contenedor.innerHTML = '<p>No hay productos registrados.</p>';
          return;
        }

        productos.forEach(prod => {
          const card = document.createElement('div');
          card.className = 'card';
          
          // Ajustar la ruta de la imagen si viene de Pages CMS
          let rutaImagen = prod.imagen || 'https://cdn-icons-png.flaticon.com/512/3081/3081999.png';
          if (rutaImagen.startsWith('/public/')) {
            rutaImagen = '.' + rutaImagen;
          }

          card.innerHTML = `
            <img src="${rutaImagen}" alt="${prod.nombre}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3081/3081999.png'">
            <h3>${prod.nombre}</h3>
            <p class="precio">$${prod.precio}</p>
          `;
          contenedor.appendChild(card);
        });
      } catch (error) {
        console.error('Error al cargar productos:', error);
        document.getElementById('contenedor-productos').innerHTML = '<p>Error al cargar la lista.</p>';
      }
    }

    // Ejecutar al cargar la página
    window.onload = cargarProductos;

    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
